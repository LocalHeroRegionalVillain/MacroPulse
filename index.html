<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MacroPulse v5.5</title>
  <style>
    :root {
      --bg: #0c0c0c;
      --card-bg: #141414;
      --text-main: #fdfcf7;
      --text-muted: #737373;
      --accent: #dc2626;
      --accent-dim: #1f1f1f;
      --border-subtle: #1b1b1b;
      --font-swiss: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-swiss); }
    body { 
      background-color: var(--bg); 
      color: var(--text-main); 
      padding: 24px 20px 100px 20px; 
      -webkit-font-smoothing: antialiased; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .brand { font-size: 22px; font-weight: 900; letter-spacing: -1px; }
    .btn-profile-trigger { background: none; border: none; color: var(--text-muted); font-size: 11px; font-weight: 700; letter-spacing: 1.5px; cursor: pointer; padding: 8px; }
    .crimson-line { width: 100%; height: 2px; background: var(--accent); margin-bottom: 24px; }

    .hero-calorie-block { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 30px; }
    .hero-number { font-size: 50px; font-weight: 900; letter-spacing: -1.5px; line-height: 0.85; display: flex; align-items: baseline; }
    .hero-comma { margin-left: -1px; margin-right: 2px; }
    .hero-meta { display: flex; flex-direction: column; justify-content: space-between; height: 42px; }
    .label-calories-in { font-size: 10px; font-weight: 800; letter-spacing: 1.2px; color: var(--text-muted); line-height: 1; }
    .label-calories-remaining { font-size: 18px; font-weight: 900; letter-spacing: -0.5px; color: var(--accent); line-height: 1; }

    .macro-deck { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 34px; }
    .macro-card { background: var(--card-bg); height: 68px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    .macro-label { font-size: 8px; font-weight: 800; letter-spacing: 1px; color: var(--text-muted); }
    .macro-val { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; line-height: 1; }
    .macro-unit { font-size: 11px; font-weight: 400; color: var(--text-muted); margin-left: 1px; }
    .macro-bar-track { position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: var(--accent-dim); }
    .macro-bar-fill { height: 100%; width: 0%; transition: width 0.3s ease; }
    .fill-protein { background: var(--accent); }
    .fill-cream { background: var(--text-main); }

    .feed-header { font-size: 9px; font-weight: 800; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 14px; }
    .feed-list { display: flex; flex-direction: column; gap: 20px; }
    .entry-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .entry-main { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .entry-name { font-size: 14px; font-weight: 700; color: var(--text-main); }
    .entry-sub { font-size: 11px; font-weight: 500; color: var(--text-muted); }
    .entry-right { display: flex; align-items: center; gap: 12px; }
    .entry-cals { font-size: 15px; font-weight: 900; color: var(--text-main); }
    .btn-delete-entry { background: none; border: none; color: var(--text-muted); font-size: 16px; font-weight: 700; cursor: pointer; padding: 4px 6px; line-height: 1; }
    .btn-delete-entry:active { color: var(--accent); }

    .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg); padding: 16px 20px 24px 20px; z-index: 50; }
    .btn-log-trigger { width: 100%; height: 50px; background: var(--accent); border: none; color: var(--text-main); font-size: 12px; font-weight: 900; letter-spacing: 2px; cursor: pointer; }

    .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.82); display: none; flex-direction: column; justify-content: flex-end; z-index: 100; }
    .drawer-content { background: var(--bg); border-top: 2px solid var(--accent); padding: 24px 20px 32px 20px; display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow-y: auto; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; }
    .drawer-title { font-size: 13px; font-weight: 900; letter-spacing: 1.5px; }
    .drawer-close { background: none; border: none; color: var(--text-muted); font-size: 11px; font-weight: 700; letter-spacing: 1px; cursor: pointer; padding: 8px; }

    .modalities-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modality-box { background: var(--card-bg); height: 130px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
    .modality-box:active { background: #1a1a1a; }
    .recording { border: 1px solid var(--accent); }

    .buffer-box { background: var(--card-bg); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-height: 60px; }
    .buffer-label { font-size: 8px; font-weight: 800; letter-spacing: 1.5px; color: var(--text-muted); }
    .buffer-text { font-size: 13px; font-weight: 600; color: var(--text-main); min-height: 16px; word-break: break-word; }

    .drawer-status-row { display: flex; justify-content: space-between; align-items: center; font-size: 9px; }
    .status-left { display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.8px; }
    .status-indicator { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .btn-text-fallback { background: none; border: none; color: var(--text-muted); font-size: 9px; font-weight: 800; letter-spacing: 0.5px; cursor: pointer; padding: 6px; }

    .btn-enter { width: 100%; height: 50px; background: var(--accent); border: none; color: var(--text-main); font-size: 12px; font-weight: 900; letter-spacing: 2px; cursor: pointer; flex-shrink: 0; }
    .btn-enter:disabled { opacity: 0.5; cursor: not-allowed; }

    .settings-section-divider { font-size: 9px; font-weight: 800; letter-spacing: 1.5px; color: var(--accent); border-bottom: 1px solid var(--border-subtle); padding-bottom: 6px; margin-top: 4px; }
    .settings-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .settings-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .settings-input-group { display: flex; flex-direction: column; gap: 6px; }
    .settings-label { font-size: 9px; font-weight: 700; color: var(--text-muted); letter-spacing: 1px; }
    .settings-input, .settings-select { background: var(--card-bg); border: 1px solid var(--border-subtle); color: var(--text-main); padding: 10px 12px; font-size: 14px; font-weight: 600; outline: none; width: 100%; }
    .settings-input:focus, .settings-select:focus { border-color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <div class="brand">MacroPulse <span style="font-size:10px;color:#dc2626;">v5.5</span></div>
    <button type="button" class="btn-profile-trigger" onclick="openProfileDrawer()">PROFILE</button>
  </header>
  <div class="crimson-line"></div>

  <div class="hero-calorie-block">
    <div class="hero-number">
      <span id="calsInThousands">0</span><span class="hero-comma">,</span><span id="calsInHundreds">000</span>
    </div>
    <div class="hero-meta">
      <div class="label-calories-in">CALORIES IN</div>
      <div class="label-calories-remaining" id="labelRemaining">2000 REMAINING</div>
    </div>
  </div>

  <div class="macro-deck">
    <div class="macro-card">
      <div class="macro-label">PROTEIN</div>
      <div class="macro-val"><span id="valProtein">0</span><span class="macro-unit">g</span></div>
      <div class="macro-bar-track"><div class="macro-bar-fill fill-protein" id="barProtein"></div></div>
    </div>
    <div class="macro-card">
      <div class="macro-label">CARBS</div>
      <div class="macro-val"><span id="valCarbs">0</span><span class="macro-unit">g</span></div>
      <div class="macro-bar-track"><div class="macro-bar-fill fill-cream" id="barCarbs"></div></div>
    </div>
    <div class="macro-card">
      <div class="macro-label">FAT</div>
      <div class="macro-val"><span id="valFat">0</span><span class="macro-unit">g</span></div>
      <div class="macro-bar-track"><div class="macro-bar-fill fill-cream" id="barFat"></div></div>
    </div>
  </div>

  <div class="feed-header">ENTRIES</div>
  <div class="feed-list" id="feedList"></div>

  <div class="bottom-bar">
    <button type="button" class="btn-log-trigger" onclick="openLogDrawer()">+ LOG ENTRY</button>
  </div>

  <input type="file" id="cameraInput" accept="image/*" style="display:none;" onchange="handleCameraInput(event)">

  <div class="drawer-overlay" id="logDrawer">
    <div class="drawer-content">
      <div class="drawer-header">
        <div class="drawer-title">AUDIO-VISUAL CAPTURE</div>
        <button type="button" class="drawer-close" onclick="closeLogDrawer()">ESC</button>
      </div>

      <div class="modalities-grid">
        <div class="modality-box" id="boxAudio" onclick="handleAudioClick()">
          <svg width="60" height="50" viewBox="0 0 60 50">
            <line x1="10" y1="25" x2="10" y2="25" stroke="#fdfcf7" stroke-width="4" stroke-linecap="round"/>
            <line x1="20" y1="12" x2="20" y2="38" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
            <line x1="30" y1="0" x2="30" y2="50" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
            <line x1="40" y1="8" x2="40" y2="42" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
            <line x1="50" y1="25" x2="50" y2="25" stroke="#fdfcf7" stroke-width="4" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="modality-box" id="boxVision" onclick="document.getElementById('cameraInput').click()">
          <svg width="50" height="42" viewBox="0 0 50 42">
            <rect x="3" y="9" width="44" height="32" rx="2" fill="none" stroke="#fdfcf7" stroke-width="3"/>
            <rect x="19" y="3" width="12" height="6" fill="#fdfcf7"/>
            <circle cx="25" cy="25" r="9" fill="none" stroke="#dc2626" stroke-width="3"/>
          </svg>
        </div>
      </div>

      <div class="buffer-box">
        <div class="buffer-label">STREAM BUFFER</div>
        <div class="buffer-text" id="bufferContent">Tap an icon to capture audio or scan...</div>
      </div>

      <div class="drawer-status-row">
        <div class="status-left">
          <div class="status-indicator" id="statusDot"></div>
          <span id="statusLabel">READY // GEMINI 3.5 FLASH-LITE</span>
        </div>
        <button type="button" class="btn-text-fallback" onclick="manualPromptFallback()">KEYBOARD</button>
      </div>

      <button type="button" class="btn-enter" id="btnEnter" onclick="submitEntry()">ENTER</button>
    </div>
  </div>

  <div class="drawer-overlay" id="profileDrawer">
    <div class="drawer-content">
      <div class="drawer-header">
        <div class="drawer-title">SYSTEM PROFILE &amp; CONFIG</div>
        <button type="button" class="drawer-close" onclick="closeProfileDrawer()">ESC</button>
      </div>

      <div class="settings-section-divider">BIOMETRICS &amp; GOAL ONBOARDING</div>

      <div class="settings-row-3">
        <div class="settings-input-group">
          <label class="settings-label">HEIGHT (FT)</label>
          <input type="number" class="settings-input" id="cfgHeightFt" placeholder="5" oninput="recalculateGoalsFromBio()">
        </div>
        <div class="settings-input-group">
          <label class="settings-label">HEIGHT (IN)</label>
          <input type="number" class="settings-input" id="cfgHeightIn" placeholder="10" oninput="recalculateGoalsFromBio()">
        </div>
        <div class="settings-input-group">
          <label class="settings-label">WEIGHT (LBS)</label>
          <input type="number" class="settings-input" id="cfgWeightLbs" placeholder="185" oninput="recalculateGoalsFromBio()">
        </div>
      </div>

      <div class="settings-input-group">
        <label class="settings-label">GOAL MODE (AUTO-CALCULATES TARGETS)</label>
        <select class="settings-select" id="cfgGoalMode" onchange="recalculateGoalsFromBio()">
          <option value="custom">Custom / Manual Targets</option>
          <option value="cut">Cut (-500 kcal Deficit)</option>
          <option value="recomp">Recomp (-250 kcal Mild Deficit)</option>
          <option value="maintain">Maintain (TDEE Balance)</option>
          <option value="bulk">Lean Bulk (+300 kcal Surplus)</option>
        </select>
      </div>

      <div class="settings-section-divider">DAILY MACRO TARGETS</div>

      <div class="settings-row-2">
        <div class="settings-input-group">
          <label class="settings-label">TARGET CALORIES</label>
          <input type="number" class="settings-input" id="cfgGoalCals" value="2000">
        </div>
        <div class="settings-input-group">
          <label class="settings-label">TARGET PROTEIN (G)</label>
          <input type="number" class="settings-input" id="cfgGoalProtein" value="180">
        </div>
      </div>

      <div class="settings-row-2">
        <div class="settings-input-group">
          <label class="settings-label">TARGET CARBS (G)</label>
          <input type="number" class="settings-input" id="cfgGoalCarbs" value="200">
        </div>
        <div class="settings-input-group">
          <label class="settings-label">TARGET FAT (G)</label>
          <input type="number" class="settings-input" id="cfgGoalFat" value="65">
        </div>
      </div>

      <div class="settings-section-divider">API &amp; CLOUD SYNC</div>

      <div class="settings-input-group">
        <label class="settings-label">GEMINI API KEY</label>
        <input type="password" class="settings-input" id="cfgApiKey" placeholder="AIzaSy...">
      </div>

      <div class="settings-input-group">
        <label class="settings-label">GOOGLE APPS SCRIPT WEBHOOK URL</label>
        <input type="text" class="settings-input" id="cfgWebhook" value="https://script.google.com/macros/s/AKfycbyjSXdWMmWtw_nWSp6nMwcpMd6K_4v5c-_F_hQZ_tsGag1UulneiAqP56AUwfmCCa96/exec">
      </div>

      <button type="button" class="btn-enter" onclick="saveProfileSettings()">SAVE SETTINGS</button>
    </div>
  </div>

  <script>
    var DEFAULT_WEBHOOK = 'https://script.google.com/macros/s/AKfycbyjSXdWMmWtw_nWSp6nMwcpMd6K_4v5c-_F_hQZ_tsGag1UulneiAqP56AUwfmCCa96/exec';

    var state = {
      entries: [],
      capturedImageBase64: null,
      capturedImageMime: 'image/jpeg',
      capturedText: '',
      isRecording: false,
      bio: { heightFt: '', heightIn: '', weightLbs: '', goalMode: 'custom' },
      goals: { cals: 2000, protein: 180, carbs: 200, fat: 65 },
      apiKey: '',
      webhookUrl: DEFAULT_WEBHOOK
    };

    function formatLocalYYYYMMDD(d) {
      var year = d.getFullYear();
      var month = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return year + '-' + month + '-' + day;
    }

    function formatLocalHHMM(d) {
      var hours = String(d.getHours()).padStart(2, '0');
      var mins = String(d.getMinutes()).padStart(2, '0');
      return hours + ':' + mins;
    }

    function getOperationalDayKey() {
      var now = new Date();
      var shifted = new Date(now.getTime() - (4 * 60 * 60 * 1000));
      return formatLocalYYYYMMDD(shifted);
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function openLogDrawer() {
      resetCaptureBuffer();
      document.getElementById('logDrawer').style.display = 'flex';
    }

    function closeLogDrawer() {
      document.getElementById('logDrawer').style.display = 'none';
    }

    function recalculateGoalsFromBio() {
      var mode = document.getElementById('cfgGoalMode').value;
      if (mode === 'custom') return;

      var ft = parseFloat(document.getElementById('cfgHeightFt').value) || 0;
      var inches = parseFloat(document.getElementById('cfgHeightIn').value) || 0;
      var lbs = parseFloat(document.getElementById('cfgWeightLbs').value) || 0;

      if (lbs <= 0) return;

      var totalInches = (ft > 0) ? (ft * 12 + inches) : 70;
      var weightKg = lbs * 0.453592;
      var heightCm = totalInches * 2.54;

      var bmr = (10 * weightKg) + (6.25 * heightCm) - (5 * 40) + 5;
      var tdee = Math.round(bmr * 1.45);

      var targetCals = tdee;
      if (mode === 'cut') targetCals = tdee - 500;
      else if (mode === 'recomp') targetCals = tdee - 250;
      else if (mode === 'bulk') targetCals = tdee + 300;

      targetCals = Math.max(1400, Math.round(targetCals / 10) * 10);

      var targetProtein = Math.round(lbs * 1.0);
      var targetFat = Math.round((targetCals * 0.25) / 9);
      var remainingCals = Math.max(0, targetCals - (targetProtein * 4) - (targetFat * 9));
      var targetCarbs = Math.round(remainingCals / 4);

      document.getElementById('cfgGoalCals').value = targetCals;
      document.getElementById('cfgGoalProtein').value = targetProtein;
      document.getElementById('cfgGoalCarbs').value = targetCarbs;
      document.getElementById('cfgGoalFat').value = targetFat;
    }

    function openProfileDrawer() {
      document.getElementById('cfgHeightFt').value = state.bio.heightFt || '';
      document.getElementById('cfgHeightIn').value = state.bio.heightIn || '';
      document.getElementById('cfgWeightLbs').value = state.bio.weightLbs || '';
      document.getElementById('cfgGoalMode').value = state.bio.goalMode || 'custom';

      document.getElementById('cfgApiKey').value = state.apiKey || '';
      document.getElementById('cfgWebhook').value = state.webhookUrl || DEFAULT_WEBHOOK;
      document.getElementById('cfgGoalCals').value = (state.goals && state.goals.cals) ? state.goals.cals : 2000;
      document.getElementById('cfgGoalProtein').value = (state.goals && state.goals.protein) ? state.goals.protein : 180;
      document.getElementById('cfgGoalCarbs').value = (state.goals && state.goals.carbs) ? state.goals.carbs : 200;
      document.getElementById('cfgGoalFat').value = (state.goals && state.goals.fat) ? state.goals.fat : 65;
      document.getElementById('profileDrawer').style.display = 'flex';
    }

    function closeProfileDrawer() {
      document.getElementById('profileDrawer').style.display = 'none';
    }

    function saveProfileSettings() {
      state.bio = {
        heightFt: document.getElementById('cfgHeightFt').value.trim(),
        heightIn: document.getElementById('cfgHeightIn').value.trim(),
        weightLbs: document.getElementById('cfgWeightLbs').value.trim(),
        goalMode: document.getElementById('cfgGoalMode').value
      };
      state.apiKey = document.getElementById('cfgApiKey').value.trim();
      var enteredHook = document.getElementById('cfgWebhook').value.trim();
      state.webhookUrl = enteredHook || DEFAULT_WEBHOOK;
      state.goals = {
        cals: parseInt(document.getElementById('cfgGoalCals').value, 10) || 2000,
        protein: parseInt(document.getElementById('cfgGoalProtein').value, 10) || 180,
        carbs: parseInt(document.getElementById('cfgGoalCarbs').value, 10) || 200,
        fat: parseInt(document.getElementById('cfgGoalFat').value, 10) || 65
      };
      try {
        localStorage.setItem('mp_bio', JSON.stringify(state.bio));
        localStorage.setItem('mp_apikey', state.apiKey);
        localStorage.setItem('mp_api_key', state.apiKey);
        localStorage.setItem('mp_webhook', state.webhookUrl);
        localStorage.setItem('mp_webhook_url', state.webhookUrl);
        localStorage.setItem('mp_goals', JSON.stringify(state.goals));
      } catch (e) {}
      closeProfileDrawer();
      renderMetrics();
    }

    function loadPersistedData() {
      try {
        var savedBio = JSON.parse(localStorage.getItem('mp_bio') || 'null');
        if (savedBio && typeof savedBio === 'object') {
          state.bio = {
            heightFt: savedBio.heightFt || '',
            heightIn: savedBio.heightIn || '',
            weightLbs: savedBio.weightLbs || '',
            goalMode: savedBio.goalMode || 'custom'
          };
        }
      } catch (e) {}

      try {
        var savedGoals = JSON.parse(localStorage.getItem('mp_goals') || 'null');
        if (savedGoals && typeof savedGoals === 'object') {
          state.goals = {
            cals: Number(savedGoals.cals) || 2000,
            protein: Number(savedGoals.protein) || 180,
            carbs: Number(savedGoals.carbs) || 200,
            fat: Number(savedGoals.fat) || 65
          };
        }
      } catch (e) {}

      try {
        state.apiKey = localStorage.getItem('mp_apikey') || localStorage.getItem('mp_api_key') || '';
        var storedHook = localStorage.getItem('mp_webhook') || localStorage.getItem('mp_webhook_url') || '';
        state.webhookUrl = storedHook.trim() || DEFAULT_WEBHOOK;
      } catch (e) {
        state.webhookUrl = DEFAULT_WEBHOOK;
      }

      var dayKey = getOperationalDayKey();
      try {
        var raw = localStorage.getItem('mp_entries_' + dayKey);
        var parsed = raw ? JSON.parse(raw) : null;
        state.entries = Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        state.entries = [];
      }

      renderFeed();
      renderMetrics();
    }

    function persistEntries() {
      try {
        var dayKey = getOperationalDayKey();
        localStorage.setItem('mp_entries_' + dayKey, JSON.stringify(state.entries));
      } catch (e) {}
    }

    function deleteEntry(originalIndex) {
      if (originalIndex < 0 || originalIndex >= state.entries.length) return;
      var removed = state.entries.splice(originalIndex, 1)[0];
      persistEntries();
      renderMetrics();
      renderFeed();
      if (removed) {
        deleteFromSheets(removed);
      }
    }

    function renderMetrics() {
      if (!Array.isArray(state.entries)) state.entries = [];
      var totals = state.entries.reduce(function(acc, cur) {
        if (!cur) return acc;
        acc.cals += Number(cur.calories) || 0;
        acc.protein += Number(cur.protein) || 0;
        acc.carbs += Number(cur.carbs) || 0;
        acc.fat += Number(cur.fat) || 0;
        return acc;
      }, { cals: 0, protein: 0, carbs: 0, fat: 0 });

      var calsVal = Math.round(totals.cals);
      if (calsVal >= 1000) {
        var calsStr = calsVal.toString();
        document.getElementById('calsInThousands').textContent = calsStr.slice(0, -3);
        document.getElementById('calsInHundreds').textContent = calsStr.slice(-3);
      } else {
        document.getElementById('calsInThousands').textContent = '0';
        document.getElementById('calsInHundreds').textContent = calsVal.toString().padStart(3, '0');
      }

      var goalCals = (state.goals && state.goals.cals) ? state.goals.cals : 2000;
      var remaining = goalCals - calsVal;
      document.getElementById('labelRemaining').textContent = Math.abs(remaining) + (remaining >= 0 ? ' REMAINING' : ' OVER TARGET');

      document.getElementById('valProtein').textContent = Math.round(totals.protein);
      document.getElementById('valCarbs').textContent = Math.round(totals.carbs);
      document.getElementById('valFat').textContent = Math.round(totals.fat);

      var pPct = Math.min(100, Math.round((totals.protein / ((state.goals && state.goals.protein) || 180)) * 100));
      var cPct = Math.min(100, Math.round((totals.carbs / ((state.goals && state.goals.carbs) || 200)) * 100));
      var fPct = Math.min(100, Math.round((totals.fat / ((state.goals && state.goals.fat) || 65)) * 100));

      document.getElementById('barProtein').style.width = pPct + '%';
      document.getElementById('barCarbs').style.width = cPct + '%';
      document.getElementById('barFat').style.width = fPct + '%';
    }

    function renderFeed() {
      var feedEl = document.getElementById('feedList');
      feedEl.innerHTML = '';
      if (!Array.isArray(state.entries) || state.entries.length === 0) {
        feedEl.innerHTML = '<div style="font-size:12px;color:var(--text-muted);font-weight:600;">No entries recorded yet today.</div>';
        return;
      }
      for (var i = state.entries.length - 1; i >= 0; i--) {
        var entry = state.entries[i];
        if (!entry) continue;
        var row = document.createElement('div');
        row.className = 'entry-row';
        row.innerHTML = 
          '<div class="entry-main">' +
            '<div class="entry-name">' + escapeHtml(entry.item || 'Food Item') + '</div>' +
            '<div class="entry-sub">' + (Number(entry.protein) || 0) + 'P · ' + (Number(entry.carbs) || 0) + 'C · ' + (Number(entry.fat) || 0) + 'F · ' + (Number(entry.sodium) || 0) + 'mg Sodium</div>' +
          '</div>' +
          '<div class="entry-right">' +
            '<div class="entry-cals">' + (Number(entry.calories) || 0) + '</div>' +
            '<button type="button" class="btn-delete-entry" onclick="deleteEntry(' + i + ')" aria-label="Delete entry">&times;</button>' +
          '</div>';
        feedEl.appendChild(row);
      }
    }

    var recognition = null;
    try {
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        var SpeechConstructor = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechConstructor();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onstart = function() {
          state.isRecording = true;
          document.getElementById('boxAudio').classList.add('recording');
          document.getElementById('statusLabel').textContent = 'LISTENING...';
        };

        recognition.onresult = function(event) {
          var transcript = Array.from(event.results)
            .map(function(result) { return result[0].transcript; })
            .join('');
          state.capturedText = transcript;
          document.getElementById('bufferContent').textContent = '"' + transcript + '"';
        };

        recognition.onerror = function() { resetCaptureState(); };
        recognition.onend = function() { resetCaptureState(); };
      }
    } catch (e) {}

    function handleAudioClick() {
      if (!recognition) {
        manualPromptFallback();
        return;
      }
      if (state.isRecording) {
        try { recognition.stop(); } catch (e) {}
      } else {
        try { recognition.start(); } catch (e) { manualPromptFallback(); }
      }
    }

    function resetCaptureState() {
      state.isRecording = false;
      document.getElementById('boxAudio').classList.remove('recording');
      document.getElementById('statusLabel').textContent = 'READY // GEMINI 3.5 FLASH-LITE';
    }

    function handleCameraInput(e) {
      var file = e.target.files[0];
      if (!file) return;
      state.capturedImageMime = file.type || 'image/jpeg';
      var reader = new FileReader();
      reader.onload = function(event) {
        var base64Data = event.target.result.split(',')[1];
        state.capturedImageBase64 = base64Data;
        state.capturedText = '';
        document.getElementById('bufferContent').textContent = '[Image Captured: ' + file.name + '] Ready for vision parsing.';
      };
      reader.readAsDataURL(file);
    }

    function manualPromptFallback() {
      var input = prompt("Describe food or meal directly:", state.capturedText);
      if (input !== null && input.trim() !== "") {
        state.capturedText = input.trim();
        state.capturedImageBase64 = null;
        document.getElementById('bufferContent').textContent = '"' + input.trim() + '"';
      }
    }

    function resetCaptureBuffer() {
      state.capturedImageBase64 = null;
      state.capturedImageMime = 'image/jpeg';
      state.capturedText = '';
      document.getElementById('bufferContent').textContent = 'Tap an icon to capture audio or scan...';
      document.getElementById('statusLabel').textContent = 'READY // GEMINI 3.5 FLASH-LITE';
      var btn = document.getElementById('btnEnter');
      btn.disabled = false;
      btn.textContent = 'ENTER';
      document.getElementById('cameraInput').value = '';
    }

    async function submitEntry() {
      if (!state.capturedText && !state.capturedImageBase64) {
        alert("Please speak, take a photo, or tap KEYBOARD first.");
        return;
      }

      var btn = document.getElementById('btnEnter');
      btn.disabled = true;
      btn.textContent = 'PARSING...';

      try {
        var parsedItem = await callGeminiFlash(state.capturedText, state.capturedImageBase64, state.capturedImageMime);
        parsedItem._date = getOperationalDayKey();
        state.entries.push(parsedItem);
        persistEntries();
        renderMetrics();
        renderFeed();
        closeLogDrawer();
        syncToSheets(parsedItem);
      } catch (err) {
        alert("Failed to parse: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'ENTER';
      }
    }

    async function callGeminiFlash(textQuery, imageBase64, imageMime) {
      var cleanKey = (state.apiKey || '').trim();
      if (!cleanKey) throw new Error("Gemini API Key missing in Profile settings.");

      var endpoint = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=' + encodeURIComponent(cleanKey);

      var systemPrompt = 'You are a nutrition log parser. Output ONLY a raw, valid JSON object matching this schema: {"item": "Clean short name of food", "calories": number, "protein": number, "carbs": number, "sugar": number, "fat": number, "sodium": number}. Estimate realistically if exact macros are not specified. Return NO markdown code blocks, just raw JSON.';

      var parts = [];
      if (imageBase64) {
        parts.push({
          inlineData: {
            mimeType: imageMime || 'image/jpeg',
            data: imageBase64
          }
        });
      }
      if (textQuery) {
        parts.push({ text: textQuery });
      } else {
        parts.push({ text: "Parse this nutrition label or meal image." });
      }

      var response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: parts }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: { responseMimeType: "application/json" }
        })
      });

      if (!response.ok) {
        var errorBody = await response.text();
        throw new Error('HTTP ' + response.status + ': ' + errorBody);
      }

      var data = await response.json();
      if (!data.candidates || !data.candidates[0] || !data.candidates[0].content || !data.candidates[0].content.parts[0]) {
        throw new Error("Empty response from Gemini API.");
      }

      var rawText = data.candidates[0].content.parts[0].text.trim();
      rawText = rawText.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/, '');
      return JSON.parse(rawText);
    }

    function syncToSheets(entry) {
      var domInput = document.getElementById('cfgWebhook');
      var domUrl = domInput ? domInput.value.trim() : '';
      var url = (state.webhookUrl || domUrl || DEFAULT_WEBHOOK).trim();

      var now = new Date();
      var operationalDateStr = entry._date || getOperationalDayKey();
      var localTimeStr = formatLocalHHMM(now);

      var payload = {
        action: "append_food_log",
        source: "MacroPulse",
        timestamp: now.toISOString(),
        entry: {
          date: operationalDateStr,
          time: localTimeStr,
          item: entry.item || "Unknown item",
          portion: "1 serving",
          calories: Number(entry.calories) || 0,
          protein: Number(entry.protein) || 0,
          carbs: Number(entry.carbs) || 0,
          sugar: Number(entry.sugar) || 0,
          fat: Number(entry.fat) || 0,
          sodium: Number(entry.sodium) || 0,
          logMethod: "MacroPulse"
        }
      };

      fetch(url, {
        method: 'POST',
        mode: 'no-cors',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).catch(function(err) { console.warn('Background sync deferred:', err); });
    }

    function deleteFromSheets(entry) {
      var domInput = document.getElementById('cfgWebhook');
      var domUrl = domInput ? domInput.value.trim() : '';
      var url = (state.webhookUrl || domUrl || DEFAULT_WEBHOOK).trim();

      var payload = {
        action: "delete_food_log",
        source: "MacroPulse",
        entry: {
          date: entry._date || getOperationalDayKey(),
          item: entry.item || "",
          calories: Number(entry.calories) || 0
        }
      };

      fetch(url, {
        method: 'POST',
        mode: 'no-cors',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).catch(function(err) { console.warn('Background delete sync deferred:', err); });
    }

    loadPersistedData();
  </script>
</body>
</html>
