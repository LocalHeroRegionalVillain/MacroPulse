<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MacroPulse</title>
  <style>
    :root {
      --bg: #0c0c0c;
      --card-bg: #141414;
      --text-main: #fdfcf7;
      --text-muted: #737373;
      --accent: #dc2626;
      --accent-dim: #1f1f1f;
      --border-subtle: #1b1b1b;
      --font-swiss: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-swiss); }
    body { 
      background-color: var(--bg); 
      color: var(--text-main); 
      padding: 24px 20px 100px 20px; 
      -webkit-font-smoothing: antialiased; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .brand { font-size: 22px; font-weight: 900; letter-spacing: -1px; }
    .btn-profile-trigger { background: none; border: none; color: var(--text-muted); font-size: 11px; font-weight: 700; letter-spacing: 1.5px; cursor: pointer; }
    .crimson-line { width: 100%; height: 2px; background: var(--accent); margin-bottom: 24px; }

    /* Hero Calorie Section */
    .hero-calorie-block { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 30px; }
    .hero-number { 
      font-size: 50px; 
      font-weight: 900; 
      letter-spacing: -1.5px; 
      line-height: 0.85; 
      display: flex; 
      align-items: baseline; 
    }
    .hero-comma { margin-left: -5px; margin-right: 4px; }
    .hero-meta { 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      height: 42px; 
    }
    .label-calories-in { 
      font-size: 10px; 
      font-weight: 800; 
      letter-spacing: 1.2px; 
      color: var(--text-muted); 
      line-height: 1; 
    }
    .label-calories-remaining { 
      font-size: 18px; 
      font-weight: 900; 
      letter-spacing: -0.5px; 
      color: var(--accent); 
      line-height: 1; 
    }

    /* 3-Column Macro Deck */
    .macro-deck { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 34px; }
    .macro-card { background: var(--card-bg); height: 68px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    .macro-label { font-size: 8px; font-weight: 800; letter-spacing: 1px; color: var(--text-muted); }
    .macro-val { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; line-height: 1; }
    .macro-unit { font-size: 11px; font-weight: 400; color: var(--text-muted); margin-left: 1px; }
    .macro-bar-track { position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: var(--accent-dim); }
    .macro-bar-fill { height: 100%; width: 0%; transition: width 0.3s ease; }
    .fill-protein { background: var(--accent); }
    .fill-cream { background: var(--text-main); }

    /* Open Ledger Feed */
    .feed-header { font-size: 9px; font-weight: 800; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 14px; }
    .feed-list { display: flex; flex-direction: column; gap: 20px; }
    .entry-row { display: flex; justify-content: space-between; align-items: flex-start; }
    .entry-main { display: flex; flex-direction: column; gap: 4px; }
    .entry-name { font-size: 14px; font-weight: 700; color: var(--text-main); }
    .entry-sub { font-size: 11px; font-weight: 500; color: var(--text-muted); }
    .entry-cals { font-size: 15px; font-weight: 900; color: var(--text-main); }

    /* Bottom Touch Action */
    .bottom-bar { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      width: 100%; 
      background: var(--bg); 
      padding: 16px 20px 24px 20px; 
    }
    .btn-log-trigger { 
      width: 100%; 
      height: 50px; 
      background: var(--accent); 
      border: none; 
      color: var(--text-main); 
      font-size: 12px; 
      font-weight: 900; 
      letter-spacing: 2px; 
      cursor: pointer; 
    }

    /* Modal / Bottom Drawer Styles */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.82);
      display: none;
      flex-direction: column;
      justify-content: flex-end;
      z-index: 100;
    }
    .drawer-content {
      background: var(--bg);
      border-top: 2px solid var(--accent);
      padding: 24px 20px 32px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; }
    .drawer-title { font-size: 13px; font-weight: 900; letter-spacing: 1.5px; }
    .drawer-close { background: none; border: none; color: var(--text-muted); font-size: 11px; font-weight: 700; letter-spacing: 1px; cursor: pointer; }

    /* Audio / Visual Touch Cards */
    .modalities-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modality-box {
      background: var(--card-bg);
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }
    .modality-box:active { background: #1a1a1a; }
    .recording { border: 1px solid var(--accent); }

    /* Stream Buffer */
    .buffer-box {
      background: var(--card-bg);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 60px;
    }
    .buffer-label { font-size: 8px; font-weight: 800; letter-spacing: 1.5px; color: var(--text-muted); }
    .buffer-text { font-size: 13px; font-weight: 600; color: var(--text-main); min-height: 16px; }

    /* Sub-bar / Key Switcher */
    .drawer-status-row { display: flex; justify-content: space-between; align-items: center; font-size: 9px; }
    .status-left { display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.8px; }
    .status-indicator { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .btn-text-fallback { background: none; border: none; color: var(--text-muted); font-size: 9px; font-weight: 800; letter-spacing: 0.5px; cursor: pointer; }

    /* Enter Action */
    .btn-enter { 
      width: 100%; 
      height: 50px; 
      background: var(--accent); 
      border: none; 
      color: var(--text-main); 
      font-size: 12px; 
      font-weight: 900; 
      letter-spacing: 2px; 
      cursor: pointer; 
    }
    .btn-enter:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Profile Panel */
    .settings-input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .settings-label { font-size: 10px; font-weight: 700; color: var(--text-muted); letter-spacing: 1px; }
    .settings-input { 
      background: var(--card-bg); 
      border: 1px solid var(--border-subtle); 
      color: var(--text-main); 
      padding: 10px 12px; 
      font-size: 14px; 
      font-weight: 600; 
      outline: none; 
    }
    .settings-input:focus { border-color: var(--accent); }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="brand">MacroPulse.</div>
    <button class="btn-profile-trigger" id="btnOpenProfile">PROFILE</button>
  </header>
  <div class="crimson-line"></div>

  <!-- Hero Calorie Block -->
  <div class="hero-calorie-block">
    <div class="hero-number">
      <span id="calsInThousands">0</span><span class="hero-comma">,</span><span id="calsInHundreds">000</span>
    </div>
    <div class="hero-meta">
      <div class="label-calories-in">CALORIES IN</div>
      <div class="label-calories-remaining" id="labelRemaining">0 REMAINING</div>
    </div>
  </div>

  <!-- 3-Column Macro Deck -->
  <div class="macro-deck">
    <div class="macro-card">
      <div class="macro-label">PROTEIN</div>
      <div class="macro-val"><span id="valProtein">0</span><span class="macro-unit">g</span></div>
      <div class="macro-bar-track"><div class="macro-bar-fill fill-protein" id="barProtein"></div></div>
    </div>
    <div class="macro-card">
      <div class="macro-label">CARBS</div>
      <div class="macro-val"><span id="valCarbs">0</span><span class="macro-unit">g</span></div>
      <div class="macro-bar-track"><div class="macro-bar-fill fill-cream" id="barCarbs"></div></div>
    </div>
    <div class="macro-card">
      <div class="macro-label">FAT</div>
      <div class="macro-val"><span id="valFat">0</span><span class="macro-unit">g</span></div>
      <div class="macro-bar-track"><div class="macro-bar-fill fill-cream" id="barFat"></div></div>
    </div>
  </div>

  <!-- Open Ledger Feed -->
  <div class="feed-header">ENTRIES</div>
  <div class="feed-list" id="feedList"></div>

  <!-- Sticky Bottom Trigger -->
  <div class="bottom-bar">
    <button class="btn-log-trigger" id="btnOpenLog">+ LOG ENTRY</button>
  </div>

  <!-- Hidden Photo Capture Input -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">

  <!-- Audio-Visual Entry Drawer -->
  <div class="drawer-overlay" id="logDrawer">
    <div class="drawer-content">
      <div class="drawer-header">
        <div class="drawer-title">AUDIO-VISUAL CAPTURE</div>
        <button class="drawer-close" id="btnCloseLog">ESC</button>
      </div>

      <div class="modalities-grid">
        <!-- Centered Waveform Icon -->
        <div class="modality-box" id="boxAudio">
          <svg width="60" height="50" viewBox="0 0 60 50">
            <line x1="10" y1="25" x2="10" y2="25" stroke="#fdfcf7" stroke-width="4" stroke-linecap="round"/>
            <line x1="20" y1="12" x2="20" y2="38" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
            <line x1="30" y1="0" x2="30" y2="50" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
            <line x1="40" y1="8" x2="40" y2="42" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
            <line x1="50" y1="25" x2="50" y2="25" stroke="#fdfcf7" stroke-width="4" stroke-linecap="round"/>
          </svg>
        </div>

        <!-- Centered Aperture Icon -->
        <div class="modality-box" id="boxVision">
          <svg width="50" height="42" viewBox="0 0 50 42">
            <rect x="3" y="9" width="44" height="32" rx="2" fill="none" stroke="#fdfcf7" stroke-width="3"/>
            <rect x="19" y="3" width="12" height="6" fill="#fdfcf7"/>
            <circle cx="25" cy="25" r="9" fill="none" stroke="#dc2626" stroke-width="3"/>
          </svg>
        </div>
      </div>

      <!-- Live Stream Buffer -->
      <div class="buffer-box">
        <div class="buffer-label">STREAM BUFFER</div>
        <div class="buffer-text" id="bufferContent">Tap an icon to capture audio or scan...</div>
      </div>

      <div class="drawer-status-row">
        <div class="status-left">
          <div class="status-indicator" id="statusDot"></div>
          <span id="statusLabel">READY // MULTIMODAL FLASH</span>
        </div>
        <button class="btn-text-fallback" id="btnManualPrompt">KEYBOARD</button>
      </div>

      <button class="btn-enter" id="btnEnter">ENTER</button>
    </div>
  </div>

  <!-- Profile / Config Drawer -->
  <div class="drawer-overlay" id="profileDrawer">
    <div class="drawer-content">
      <div class="drawer-header">
        <div class="drawer-title">SYSTEM PROFILE &amp; CONFIG</div>
        <button class="drawer-close" id="btnCloseProfile">ESC</button>
      </div>

      <div class="settings-input-group">
        <label class="settings-label">GEMINI API KEY</label>
        <input type="password" class="settings-input" id="cfgApiKey" placeholder="AIzaSy...">
      </div>

      <div class="settings-input-group">
        <label class="settings-label">GOOGLE APPS SCRIPT WEBHOOK URL</label>
        <input type="text" class="settings-input" id="cfgWebhook" placeholder="https://script.google.com/.../exec">
      </div>

      <div class="settings-input-group">
        <label class="settings-label">TARGET CALORIES</label>
        <input type="number" class="settings-input" id="cfgGoalCals" value="2000">
      </div>

      <div class="settings-input-group">
        <label class="settings-label">TARGET PROTEIN (G)</label>
        <input type="number" class="settings-input" id="cfgGoalProtein" value="180">
      </div>

      <div class="settings-input-group">
        <label class="settings-label">TARGET CARBS (G)</label>
        <input type="number" class="settings-input" id="cfgGoalCarbs" value="200">
      </div>

      <div class="settings-input-group">
        <label class="settings-label">TARGET FAT (G)</label>
        <input type="number" class="settings-input" id="cfgGoalFat" value="65">
      </div>

      <button class="btn-enter" id="btnSaveProfile">SAVE SETTINGS</button>
    </div>
  </div>

  <script>
    // System State
    const state = {
      entries: [],
      capturedImageBase64: null,
      capturedText: '',
      isRecording: false,
      goals: { cals: 2000, protein: 180, carbs: 200, fat: 65 },
      apiKey: '',
      webhookUrl: ''
    };

    // Calculate current operational day string (reset boundary 4:00 AM)
    function getOperationalDayKey() {
      const now = new Date();
      const shifted = new Date(now.getTime() - (4 * 60 * 60 * 1000));
      return shifted.toISOString().split('T')[0];
    }

    // Storage Management
    function loadPersistedData() {
      const savedGoals = localStorage.getItem('mp_goals');
      if (savedGoals) state.goals = JSON.parse(savedGoals);
      state.apiKey = localStorage.getItem('mp_apikey') || '';
      state.webhookUrl = localStorage.getItem('mp_webhook') || '';

      const dayKey = getOperationalDayKey();
      const savedEntries = localStorage.getItem(`mp_entries_${dayKey}`);
      state.entries = savedEntries ? JSON.parse(savedEntries) : [];

      renderFeed();
      renderMetrics();
    }

    function persistEntries() {
      const dayKey = getOperationalDayKey();
      localStorage.setItem(`mp_entries_${dayKey}`, JSON.stringify(state.entries));
    }

    // Render Hero & Macro Gauges
    function renderMetrics() {
      const totals = state.entries.reduce((acc, cur) => {
        acc.cals += cur.calories || 0;
        acc.protein += cur.protein || 0;
        acc.carbs += cur.carbs || 0;
        acc.fat += cur.fat || 0;
        return acc;
      }, { cals: 0, protein: 0, carbs: 0, fat: 0 });

      // Split 1,450 into '1' and '450' for balanced kerning
      const formattedCals = totals.cals.toLocaleString();
      if (totals.cals >= 1000) {
        const parts = formattedCals.split(',');
        document.getElementById('calsInThousands').textContent = parts[0];
        document.getElementById('calsInHundreds').textContent = parts[1];
        document.querySelector('.hero-comma').style.display = 'inline';
      } else {
        document.getElementById('calsInThousands').textContent = '0';
        document.getElementById('calsInHundreds').textContent = totals.cals.toString().padStart(3, '0');
        document.querySelector('.hero-comma').style.display = 'inline';
      }

      const remaining = state.goals.cals - totals.cals;
      document.getElementById('labelRemaining').textContent = `${remaining} REMAINING`;

      document.getElementById('valProtein').textContent = totals.protein;
      document.getElementById('valCarbs').textContent = totals.carbs;
      document.getElementById('valFat').textContent = totals.fat;

      const pPct = Math.min(100, Math.round((totals.protein / state.goals.protein) * 100));
      const cPct = Math.min(100, Math.round((totals.carbs / state.goals.carbs) * 100));
      const fPct = Math.min(100, Math.round((totals.fat / state.goals.fat) * 100));

      document.getElementById('barProtein').style.width = `${pPct}%`;
      document.getElementById('barCarbs').style.width = `${cPct}%`;
      document.getElementById('barFat').style.width = `${fPct}%`;
    }

    // Render Ledger Feed
    function renderFeed() {
      const feedEl = document.getElementById('feedList');
      feedEl.innerHTML = '';
      state.entries.slice().reverse().forEach(entry => {
        const row = document.createElement('div');
        row.className = 'entry-row';
        row.innerHTML = `
          <div class="entry-main">
            <div class="entry-name">${entry.item}</div>
            <div class="entry-sub">${entry.protein}P · ${entry.carbs}C · ${entry.fat}F · ${entry.sodium || 0}mg Sodium</div>
          </div>
          <div class="entry-cals">${entry.calories}</div>
        `;
        feedEl.appendChild(row);
      });
    }

    // Modal Drawer Controls
    const logDrawer = document.getElementById('logDrawer');
    const profileDrawer = document.getElementById('profileDrawer');

    document.getElementById('btnOpenLog').addEventListener('click', () => {
      resetCaptureBuffer();
      logDrawer.style.display = 'flex';
    });
    document.getElementById('btnCloseLog').addEventListener('click', () => logDrawer.style.display = 'none');

    document.getElementById('btnOpenProfile').addEventListener('click', () => {
      document.getElementById('cfgApiKey').value = state.apiKey;
      document.getElementById('cfgWebhook').value = state.webhookUrl;
      document.getElementById('cfgGoalCals').value = state.goals.cals;
      document.getElementById('cfgGoalProtein').value = state.goals.protein;
      document.getElementById('cfgGoalCarbs').value = state.goals.carbs;
      document.getElementById('cfgGoalFat').value = state.goals.fat;
      profileDrawer.style.display = 'flex';
    });
    document.getElementById('btnCloseProfile').addEventListener('click', () => profileDrawer.style.display = 'none');

    document.getElementById('btnSaveProfile').addEventListener('click', () => {
      state.apiKey = document.getElementById('cfgApiKey').value.trim();
      state.webhookUrl = document.getElementById('cfgWebhook').value.trim();
      state.goals = {
        cals: parseInt(document.getElementById('cfgGoalCals').value, 10) || 2000,
        protein: parseInt(document.getElementById('cfgGoalProtein').value, 10) || 180,
        carbs: parseInt(document.getElementById('cfgGoalCarbs').value, 10) || 200,
        fat: parseInt(document.getElementById('cfgGoalFat').value, 10) || 65
      };
      localStorage.setItem('mp_apikey', state.apiKey);
      localStorage.setItem('mp_webhook', state.webhookUrl);
      localStorage.setItem('mp_goals', JSON.stringify(state.goals));
      profileDrawer.style.display = 'none';
      renderMetrics();
    });

    // Native Audio Recording (SpeechRecognition fallback)
    const boxAudio = document.getElementById('boxAudio');
    let recognition = null;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechConstructor = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechConstructor();
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onstart = () => {
        state.isRecording = true;
        boxAudio.classList.add('recording');
        document.getElementById('statusLabel').textContent = 'LISTENING...';
      };

      recognition.onresult = (event) => {
        const transcript = Array.from(event.results)
          .map(result => result[0].transcript)
          .join('');
        state.capturedText = transcript;
        document.getElementById('bufferContent').textContent = `"${transcript}"`;
      };

      recognition.onerror = () => resetCaptureState();
      recognition.onend = () => resetCaptureState();
    }

    boxAudio.addEventListener('click', () => {
      if (!recognition) {
        manualPromptFallback();
        return;
      }
      if (state.isRecording) {
        recognition.stop();
      } else {
        recognition.start();
      }
    });

    function resetCaptureState() {
      state.isRecording = false;
      boxAudio.classList.remove('recording');
      document.getElementById('statusLabel').textContent = 'DIRECT MULTIMODAL FLASH (AUDIO / VISION)';
    }

    // Vision / Camera Capture
    const boxVision = document.getElementById('boxVision');
    const cameraInput = document.getElementById('cameraInput');

    boxVision.addEventListener('click', () => cameraInput.click());

    cameraInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const base64Data = event.target.result.split(',')[1];
        state.capturedImageBase64 = base64Data;
        state.capturedText = '';
        document.getElementById('bufferContent').textContent = `[Image Captured: ${file.name}] Ready for vision parsing.`;
      };
      reader.readAsDataURL(file);
    });

    // Keyboard Fallback
    document.getElementById('btnManualPrompt').addEventListener('click', manualPromptFallback);

    function manualPromptFallback() {
      const input = prompt("Describe food or meal directly:", state.capturedText);
      if (input !== null) {
        state.capturedText = input;
        state.capturedImageBase64 = null;
        document.getElementById('bufferContent').textContent = `"${input}"`;
      }
    }

    function resetCaptureBuffer() {
      state.capturedImageBase64 = null;
      state.capturedText = '';
      document.getElementById('bufferContent').textContent = 'Tap an icon to capture audio or scan...';
      document.getElementById('statusLabel').textContent = 'DIRECT MULTIMODAL FLASH (AUDIO / VISION)';
      document.getElementById('btnEnter').disabled = false;
      document.getElementById('btnEnter').textContent = 'ENTER';
    }

    // Enter & Direct Gemini Flash Parse
    document.getElementById('btnEnter').addEventListener('click', async () => {
      if (!state.capturedText && !state.capturedImageBase64) {
        alert("Please speak or take a photo first.");
        return;
      }

      const btn = document.getElementById('btnEnter');
      btn.disabled = true;
      btn.textContent = 'PARSING...';

      try {
        const parsedItem = await callGeminiFlash(state.capturedText, state.capturedImageBase64);
        
        // Optimistic UI updates
        state.entries.push(parsedItem);
        persistEntries();
        renderMetrics();
        renderFeed();

        // Dismiss drawer
        logDrawer.style.display = 'none';

        // Fire-and-forget background sync
        syncToSheets(parsedItem);

      } catch (err) {
        alert("Failed to parse: " + err.message);0
        btn.disabled = false;
        btn.textContent = 'ENTER';
      }
    });

    // Client-Side Gemini Flash Parsing
async function callGeminiFlash(textQuery, imageBase64) {
  const cleanKey = (state.apiKey || '').trim();
  if (!cleanKey) throw new Error("Gemini API Key missing in Profile settings.");

  // Direct endpoint using the live gemini-3.8-flash model
  const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${encodeURIComponent(cleanKey)}`;

  const systemPrompt = `You are a nutrition log parser. Output ONLY a raw, valid JSON object matching this schema:
  {
    "item": "Clean short name of food",
    "calories": number,
    "protein": number,
    "carbs": number,
    "fat": number,
    "sodium": number
  }
  Estimate realistically if exact macros are not specified. Return NO markdown code blocks, just raw JSON.`;

  const parts = [];
  if (imageBase64) {
    parts.push({
      inlineData: {
        mimeType: "image/jpeg",
        data: imageBase64
      }
    });
  }
  if (textQuery) {
    parts.push({ text: textQuery });
  } else {
    parts.push({ text: "Parse this nutrition label or meal image." });
  }

  const response = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts }],
      systemInstruction: { parts: [{ text: systemPrompt }] },
      generationConfig: { responseMimeType: "application/json" }
    })
  });

  if (!response.ok) {
    const errorBody = await response.text();
    throw new Error(`HTTP ${response.status}: ${errorBody}`);
  }

  const data = await response.json();
  const rawText = data.candidates[0].content.parts[0].text;
  return JSON.parse(rawText);
}

// Fire-and-Forget Google Sheets Sync
function syncToSheets(entry) {
  if (!state.webhookUrl) return;

  const now = new Date();
  const dateStr = now.toISOString().split('T')[0];
  const timeStr = now.toTimeString().slice(0, 5);

  const payload = {
    action: "append_food_log",
    source: "MacroPulse",
    timestamp: now.toISOString(),
    entry: {
      date: dateStr,
      time: timeStr,
      item: entry.item || "Unknown item",
      portion: "1 serving",
      calories: Number(entry.calories) || 0,
      protein: Number(entry.protein) || 0,
      carbs: Number(entry.carbs) || 0,
      sugar: 0,
      fat: Number(entry.fat) || 0,
      sodium: Number(entry.sodium) || 0,
      logMethod: "MacroPulse MultiModal"
    }
  };

  fetch(state.webhookUrl, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  }).then(() => {
    console.log("Sync dispatched to Apps Script");
  }).catch(err => console.warn('Background sync deferred:', err));
}
    // Initialize
    loadPersistedData();
  </script>
