<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MacroPulse</title>
  <style>
    :root {
      --bg: #0c0c0c;
      --card-bg: #141414;
      --text-main: #fdfcf7;
      --text-muted: #737373;
      --accent: #dc2626;
      --accent-dim: #1f1f1f;
      --border-subtle: #1b1b1b;
      --font-swiss: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-swiss); }
    body { 
      background-color: var(--bg); 
      color: var(--text-main); 
      padding: 24px 20px 100px 20px; 
      -webkit-font-smoothing: antialiased; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .brand { font-size: 22px; font-weight: 900; letter-spacing: -1px; }
    .btn-profile-trigger { background: none; border: none; color: var(--text-muted); font-size: 11px; font-weight: 700; letter-spacing: 1.5px; cursor: pointer; padding: 6px 0; }
    .crimson-line { width: 100%; height: 2px; background: var(--accent); margin-bottom: 24px; }

    /* Hero Calorie Section */
    .hero-calorie-block { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 30px; }
    .hero-number { 
      font-size: 50px; 
      font-weight: 900; 
      letter-spacing: -1.5px; 
      line-height: 0.85; 
      display: flex; 
      align-items: baseline; 
    }
    .hero-comma { margin-left: -5px; margin-right: 4px; }
    .hero-meta { 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      height: 42px; 
    }
    .label-calories-in { 
      font-size: 10px; 
      font-weight: 800; 
      letter-spacing: 1.2px; 
      color: var(--text-muted); 
      line-height: 1; 
    }
    .label-calories-remaining { 
      font-size: 18px; 
      font-weight: 900; 
      letter-spacing: -0.5px; 
      color: var(--accent); 
      line-height: 1; 
    }

    /* 3-Column Macro Deck */
    .macro-deck { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 34px; }
    .macro-card { background: var(--card-bg); height: 68px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    .macro-label { font-size: 8px; font-weight: 800; letter-spacing: 1px; color: var(--text-muted); }
    .macro-val { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; line-height: 1; }
    .macro-unit { font-size: 11px; font-weight: 400; color: var(--text-muted); margin-left: 1px; }
    .macro-bar-track { position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: var(--accent-dim); }
    .macro-bar-fill { height: 100%; width: 0%; transition: width 0.3s ease; }
    .fill-protein { background: var(--accent); }
    .fill-cream { background: var(--text-main); }

    /* Open Ledger Feed */
    .feed-header { font-size: 9px; font-weight: 800; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 14px; }
    .feed-list { display: flex; flex-direction: column; gap: 20px; }
    .entry-row { display: flex; justify-content: space-between; align-items: flex-start; }
    .entry-main { display: flex; flex-direction: column; gap: 4px; }
    .entry-name { font-size: 14px; font-weight: 700; color: var(--text-main); }
    .entry-sub { font-size: 11px; font-weight: 500; color: var(--text-muted); }
    .entry-cals { font-size: 15px; font-weight: 900; color: var(--text-main); }

    /* Bottom Touch Action */
    .bottom-bar { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      width: 100%; 
      background: var(--bg); 
      padding: 16px 20px 24px 20px; 
      z-index: 50;
    }
    .btn-log-trigger { 
      width: 100%; 
      height: 50px; 
      background: var(--accent); 
      border: none; 
      color: var(--text-main); 
      font-size: 12px; 
      font-weight: 900; 
      letter-spacing: 2px; 
      cursor: pointer; 
      touch-action: manipulation;
    }

    /* Modal / Bottom Drawer Styles */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.82);
      display: none;
      flex-direction: column;
      justify-content: flex-end;
      z-index: 100;
    }
    .drawer-content {
      background: var(--bg);
      border-top: 2px solid var(--accent);
      padding: 24px 20px 32px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; }
    .drawer-title { font-size: 13px; font-weight: 900; letter-spacing: 1.5px; }
    .drawer-close { background: none; border: none; color: var(--text-muted); font-size: 11px; font-weight: 700; letter-spacing: 1px; cursor: pointer; padding: 6px; }

    /* Audio / Visual Touch Cards */
    .modalities-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modality-box {
      background: var(--card-bg);
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    .modality-box:active { background: #1a1a1a; }
    .recording { border: 1px solid var(--accent); }

    /* Stream Buffer */
    .buffer-box {
      background: var(--card-bg);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 60px;
    }
    .buffer-label { font-size: 8px; font-weight: 800; letter-spacing: 1.5px; color: var(--text-muted); }
    .buffer-text { font-size: 13px; font-weight: 600; color: var(--text-main); min-height: 16px; word-break: break-word; }

    /* Sub-bar / Key Switcher */
    .drawer-status-row { display: flex; justify-content: space-between; align-items: center; font-size: 9px; }
    .status-left { display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.8px; }
    .status-indicator { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .btn-text-fallback { background: none; border: none; color: var(--text-muted); font-size: 9px; font-weight: 800; letter-spacing: 0.5px; cursor: pointer; padding: 6px 0; }

    /* Enter Action */
    .btn-enter { 
      width: 100%; 
      height: 50px; 
      background: var(--accent); 
      border: none; 
      color: var(--text-main); 
      font-size: 12px; 
      font-weight: 900; 
      letter-spacing: 2px; 
      cursor: pointer; 
      touch-action: manipulation;
    }
    .btn-enter:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Profile Panel */
    .settings-input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .settings-label { font-size: 10px; font-weight: 700; color: var(--text-muted); letter-spacing: 1px; }
    .settings-input { 
      background: var(--card-bg); 
      border: 1px solid var(--border-subtle); 
      color: var(--text-main); 
      padding: 10px 12px; 
      font-size: 14px; 
      font-weight: 600; 
      outline: none; 
    }
    .settings-input:focus { border-color: var(--accent); }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="brand">MacroPulse.</div>
    <button type="button" class="btn-profile-trigger" id="btnOpenProfile">PROFILE</button>
  </header>
  <div class="crimson-line"></div>

  <!-- Hero Calorie Block -->
  <div class="hero-calorie-block">
    <div class="hero-number">
      <span id="calsInThousands">0</span><span class="hero-comma">,</span><span id="calsInHundreds">000</span>
    </div>
    <div class="hero-meta">
      <div class="label-calories-in">CALORIES IN</div>
      <div class="label-calories-remaining" id="labelRemaining">2000 REMAINING</div>
    </div>
  </div>

  <!-- 3-Column Macro Deck -->
  <div class="macro-deck">
    <div class="macro-card">
      <div class="macro-label">PROTEIN</div>
      <div class="macro-val"><span id="valProtein">0</span><span class="macro-unit">g</span></div>
      <div class="macro-bar-track"><div class="macro-bar-fill fill-protein" id="barProtein"></div></div>
    </div>
    <div class="macro-card">
      <div class="macro-label">CARBS</div>
      <div class="macro-val"><span id="valCarbs">0</span><span class="macro-unit">g</span></div>
      <div class="macro-bar-track"><div class="macro-bar-fill fill-cream" id="barCarbs"></div></div>
    </div>
    <div class="macro-card">
      <div class="macro-label">FAT</div>
      <div class="macro-val"><span id="valFat">0</span><span class="macro-unit">g</span></div>
      <div class="macro-bar-track"><div class="macro-bar-fill fill-cream" id="barFat"></div></div>
    </div>
  </div>

  <!-- Open Ledger Feed -->
  <div class="feed-header">ENTRIES</div>
  <div class="feed-list" id="feedList"></div>

  <!-- Sticky Bottom Trigger -->
  <div class="bottom-bar">
    <button type="button" class="btn-log-trigger" id="btnOpenLog">+ LOG ENTRY</button>
  </div>

  <!-- Hidden Photo Capture Input -->
  <input type="file" id="cameraInput" accept="image/*" style="display:none;">

  <!-- Audio-Visual Entry Drawer -->
  <div class="drawer-overlay" id="logDrawer">
    <div class="drawer-content">
      <div class="drawer-header">
        <div class="drawer-title">AUDIO-VISUAL CAPTURE</div>
        <button type="button" class="drawer-close" id="btnCloseLog">ESC</button>
      </div>

      <div class="modalities-grid">
        <!-- Centered Waveform Icon -->
        <div class="modality-box" id="boxAudio">
          <svg width="60" height="50" viewBox="0 0 60 50">
            <line x1="10" y1="25" x2="10" y2="25" stroke="#fdfcf7" stroke-width="4" stroke-linecap="round"/>
            <line x1="20" y1="12" x2="20" y2="38" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
            <line x1="30" y1="0" x2="30" y2="50" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
            <line x1="40" y1="8" x2="40" y2="42" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
            <line x1="50" y1="25" x2="50" y2="25" stroke="#fdfcf7" stroke-width="4" stroke-linecap="round"/>
          </svg>
        </div>

        <!-- Centered Aperture Icon -->
        <div class="modality-box" id="boxVision">
          <svg width="50" height="42" viewBox="0 0 50 42">
            <rect x="3" y="9" width="44" height="32" rx="2" fill="none" stroke="#fdfcf7" stroke-width="3"/>
            <rect x="19" y="3" width="12" height="6" fill="#fdfcf7"/>
            <circle cx="25" cy="25" r="9" fill="none" stroke="#dc2626" stroke-width="3"/>
          </svg>
        </div>
      </div>

      <!-- Live Stream Buffer -->
      <div class="buffer-box">
        <div class="buffer-label">STREAM BUFFER</div>
        <div class="buffer-text" id="bufferContent">Tap an icon to capture audio or scan...</div>
      </div>

      <div class="drawer-status-row">
        <div class="status-left">
          <div class="status-indicator" id="statusDot"></div>
          <span id="statusLabel">READY // GEMINI 3.5 FLASH-LITE</span>
        </div>
        <button type="button" class="btn-text-fallback" id="btnManualPrompt">KEYBOARD</button>
      </div>

      <button type="button" class="btn-enter" id="btnEnter">ENTER</button>
    </div>
  </div>

  <!-- Profile / Config Drawer -->
  <div class="drawer-overlay" id="profileDrawer">
    <div class="drawer-content">
      <div class="drawer-header">
        <div class="drawer-title">SYSTEM PROFILE &amp; CONFIG</div>
        <button type="button" class="drawer-close" id="btnCloseProfile">ESC</button>
      </div>

      <div class="settings-input-group">
        <label class="settings-label">GEMINI API KEY</label>
        <input type="password" class="settings-input" id="cfgApiKey" placeholder="AIzaSy...">
      </div>

      <div class="settings-input-group">
